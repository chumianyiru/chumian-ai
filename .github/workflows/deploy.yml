name: Deploy Backend

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Silence server bashrc error
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            mkdir -p /opt/rh/devtoolset-9
            touch /opt/rh/devtoolset-9/enable

      - name: Copy backend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 30m
          source: "backend/"
          target: "/tmp/chumian-ai-staging"
          rm: true

      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 30m
          script_stop: false
          script: |
            set -e
            set -x
            export DEBIAN_FRONTEND=noninteractive

            APP_DIR=/opt/chumian-ai
            rm -rf $APP_DIR
            mv /tmp/chumian-ai-staging/backend $APP_DIR
            cd $APP_DIR
            echo "[deploy] 后端代码已部署到 $APP_DIR"

            # 服务器直接下载 Miniconda 并通过国内镜像安装 Python 3.11
            MINICONDA=/opt/miniconda3
            PYTHON_DIR=$MINICONDA
            PYTHON_OK=false
            "$PYTHON_DIR/bin/python3" --version >/dev/null 2>&1 && PYTHON_OK=true || true

            if [ "$PYTHON_OK" = "true" ]; then
              echo "[deploy] 检测到可用的 Python: $PYTHON_DIR/bin/python3"
            else
              echo "[deploy] 开始下载 Miniconda 安装包"
              rm -rf $MINICONDA
              CONDA_SH=/tmp/miniconda.sh
              rm -f $CONDA_SH
              download_conda() {
                echo "[deploy] 尝试下载: $1"
                curl -fsSL --connect-timeout 60 --max-time 600 --retry 2 -o $CONDA_SH "$1" || return 1
              }
              # 使用支持 CentOS 7 (GLIBC 2.17) 的 Miniconda 版本
              download_conda "https://mirrors.tuna.tsinghua.edu.cn/anaconda/miniconda/Miniconda3-py311_23.11.0-2-Linux-x86_64.sh" || \
              download_conda "https://mirrors.aliyun.com/anaconda/miniconda/Miniconda3-py311_23.11.0-2-Linux-x86_64.sh" || \
              download_conda "https://mirrors.huaweicloud.com/anaconda/miniconda/Miniconda3-py311_23.11.0-2-Linux-x86_64.sh" || \
              (echo "ERROR: 无法下载 Miniconda 安装包"; ls -lh $CONDA_SH 2>/dev/null || true; exit 1)
              echo "[deploy] Miniconda 下载完成，开始安装"
              bash $CONDA_SH -b -p $MINICONDA
              rm -f $CONDA_SH
              "$PYTHON_DIR/bin/python3" --version
              echo "[deploy] Miniconda 安装完成"
            fi

            $PYTHON_DIR/bin/python3 -m venv venv
            source venv/bin/activate
            echo "[deploy] 升级 pip"
            timeout 300 pip install --upgrade pip -i https://pypi.tuna.tsinghua.edu.cn/simple --timeout 60
            echo "[deploy] 安装依赖"
            timeout 600 pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple --timeout 60
            echo "[deploy] 依赖安装完成"

            cat > .env <<ENV_EOF
            GLM_API_KEY=${{ secrets.GLM_API_KEY }}
            GLM_BASE_URL=https://open.bigmodel.cn/api/paas/v4
            SMTP_HOST=smtp.qq.com
            SMTP_PORT=465
            SMTP_USER=3930535663@qq.com
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            EXPECTED_PACKAGE=com.chumian.ai
            EXPECTED_MD5=${{ secrets.EXPECTED_MD5 }}
            INVITE_CODE=4224242515552
            DAILY_POINTS=90000000
            MAX_CONCURRENT_CHATS=5
            HOST=0.0.0.0
            PORT=24512
            ENV_EOF

            cat > /etc/systemd/system/chumian-ai.service <<SERVICE_EOF
            [Unit]
            Description=初眠AI 后端服务
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=$APP_DIR
            Environment=PATH=$APP_DIR/venv/bin:/opt/miniconda3/bin
            ExecStart=$APP_DIR/venv/bin/python3 -m uvicorn main:app --host 0.0.0.0 --port 24512
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            SERVICE_EOF

            # 清理可能占用 24512 端口的旧进程
            echo "[deploy] 停止旧服务并禁用自动重启"
            systemctl disable chumian-ai 2>/dev/null || true
            systemctl stop chumian-ai 2>/dev/null || true
            sleep 3
            echo "[deploy] 清理占用 24512 端口的旧进程"
            fuser -k 24512/tcp 2>/dev/null || true
            for pid in $(ss -ltnp 2>/dev/null | grep ':24512' | grep -oP 'pid=\K[0-9]+'); do
              echo "[deploy] 强制结束 PID $pid"
              kill -9 "$pid" 2>/dev/null || true
            done
            sleep 3
            echo "[deploy] 清理 Python 缓存"
            find $APP_DIR -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
            find $APP_DIR -name '*.pyc' -delete 2>/dev/null || true

            systemctl daemon-reload
            systemctl enable chumian-ai
            systemctl start chumian-ai || true
            sleep 5
            if systemctl is-active --quiet chumian-ai; then
              echo "[deploy] 服务启动成功"
              systemctl status chumian-ai --no-pager
            else
              echo "[deploy] 服务启动失败，查看日志"
              journalctl -u chumian-ai -n 50 --no-pager
              exit 1
            fi
