name: Deploy Backend

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Silence server bashrc error
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            mkdir -p /opt/rh/devtoolset-9
            touch /opt/rh/devtoolset-9/enable

      - name: Copy backend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "backend/"
          target: "/tmp/chumian-ai-staging"
          rm: true

      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive

            # 确保系统上有 Python 3.8+
            if command -v python3 >/dev/null 2>&1; then
              PY_VER=$(python3 -c 'import sys; print(sys.version_info.major*10+sys.version_info.minor)')
            else
              PY_VER=0
            fi

            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y python3 python3-venv python3-pip systemd
            elif command -v yum >/dev/null 2>&1; then
              if [ "$PY_VER" -lt 38 ]; then
                yum install -y epel-release
                yum install -y python38 python38-pip || yum install -y rh-python38 rh-python38-python-pip
              fi
              yum install -y systemd
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y python3 python3-pip systemd
            else
              echo "No supported package manager found"; exit 1
            fi

            APP_DIR=/opt/chumian-ai
            rm -rf $APP_DIR
            mv /tmp/chumian-ai-staging/backend $APP_DIR
            cd $APP_DIR

            if command -v python3.8 >/dev/null 2>&1; then
              PY=python3.8
            elif [ -x /opt/rh/rh-python38/root/usr/bin/python3 ]; then
              PY=/opt/rh/rh-python38/root/usr/bin/python3
            else
              PY=python3
            fi

            $PY -m venv venv || $PY -m virtualenv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            cat > .env <<ENV_EOF
            GLM_API_KEY=${{ secrets.GLM_API_KEY }}
            GLM_BASE_URL=https://open.bigmodel.cn/api/paas/v4
            SMTP_HOST=smtp.qq.com
            SMTP_PORT=465
            SMTP_USER=3930535663@qq.com
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            EXPECTED_PACKAGE=com.chumian.ai
            EXPECTED_MD5=${{ secrets.EXPECTED_MD5 }}
            DAILY_POINTS=90000000
            MAX_CONCURRENT_CHATS=5
            HOST=0.0.0.0
            PORT=24512
            ENV_EOF

            cat > /etc/systemd/system/chumian-ai.service <<SERVICE_EOF
            [Unit]
            Description=初眠AI 后端服务
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=$APP_DIR
            Environment=PATH=$APP_DIR/venv/bin
            ExecStart=$APP_DIR/venv/bin/uvicorn main:app --host 0.0.0.0 --port 24512
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            SERVICE_EOF

            systemctl daemon-reload
            systemctl enable chumian-ai
            systemctl restart chumian-ai
            sleep 3
            systemctl status chumian-ai --no-pager
