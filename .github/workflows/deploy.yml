name: Deploy Backend

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Silence server bashrc error
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            mkdir -p /opt/rh/devtoolset-9
            touch /opt/rh/devtoolset-9/enable

      - name: Download Miniconda installer on runner
        run: |
          curl -fsSL -o miniconda.sh https://mirrors.tuna.tsinghua.edu.cn/anaconda/miniconda/Miniconda3-latest-Linux-x86_64.sh

      - name: Copy backend and Miniconda installer to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 30m
          source: "backend/,miniconda.sh"
          target: "/tmp/chumian-ai-staging"
          rm: true

      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive

            APP_DIR=/opt/chumian-ai
            rm -rf $APP_DIR
            mv /tmp/chumian-ai-staging/backend $APP_DIR
            cd $APP_DIR

            # 使用 GitHub Actions runner 已传过来的 Miniconda 安装包（避免服务器下载失败）
            MINICONDA=/opt/miniconda3
            if [ ! -x "$MINICONDA/bin/python3" ]; then
              bash /tmp/chumian-ai-staging/miniconda.sh -b -p $MINICONDA
            fi

            $MINICONDA/bin/python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip -i https://pypi.tuna.tsinghua.edu.cn/simple
            pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

            cat > .env <<ENV_EOF
            GLM_API_KEY=${{ secrets.GLM_API_KEY }}
            GLM_BASE_URL=https://open.bigmodel.cn/api/paas/v4
            SMTP_HOST=smtp.qq.com
            SMTP_PORT=465
            SMTP_USER=3930535663@qq.com
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            EXPECTED_PACKAGE=com.chumian.ai
            EXPECTED_MD5=${{ secrets.EXPECTED_MD5 }}
            DAILY_POINTS=90000000
            MAX_CONCURRENT_CHATS=5
            HOST=0.0.0.0
            PORT=24512
            ENV_EOF

            cat > /etc/systemd/system/chumian-ai.service <<SERVICE_EOF
            [Unit]
            Description=初眠AI 后端服务
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=$APP_DIR
            Environment=PATH=$APP_DIR/venv/bin:/opt/python311/bin
            ExecStart=$APP_DIR/venv/bin/python3 -m uvicorn main:app --host 0.0.0.0 --port 24512
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            SERVICE_EOF

            systemctl daemon-reload
            systemctl enable chumian-ai
            systemctl restart chumian-ai
            sleep 3
            systemctl status chumian-ai --no-pager
